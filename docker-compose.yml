services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ascend
      POSTGRES_PASSWORD: ascend
      POSTGRES_DB: ascend
    ports:
      - "25432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ascend"]
      interval: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+asyncpg://ascend:ascend@postgres:5432/ascend
    env_file: .env
    ports:
      - "28000:28000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./data:/app/data

  frontend:
    build: ./frontend
    environment:
      BACKEND_URL: http://backend:28000
    ports:
      - "25173:25173"
    depends_on:
      - backend

volumes:
  pgdata:
